[package]
name = "rustshell"
version = "0.5.15"
edition = "2021"
description = "Cross-platform remote shell client via RustDesk relay infrastructure"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
build = "build.rs"

[dependencies]
# 协议与传输自己实现：proto/rustshell.proto、src/wire.rs、src/link.rs。
protobuf = { version = "3.7", features = ["with-bytes"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
# NaCl：Ed25519 验签、box 密钥交换、secretbox 会话加密。
sodiumoxide = "0.2"
zstd = "0.13"
clap = { version = "4.2", features = ["derive"] }
crossterm = "0.27"
# 客户端侧终端模拟。ConPTY 远端用绝对光标定位原地重绘、而不是把行往上顶，
# 所以本地终端自己的滚动缓冲永远是空的；只有自己维护屏幕模型才留得住历史。
vt100 = "0.15"
# 读本地剪贴板。剪贴板里放的是图片时终端一个字节都不发，没有粘贴事件可转发，
# 只能自己去取。不启用 Wayland，免得给 Linux 构建引入额外的原生依赖。
arboard = { version = "3", default-features = false, features = ["image-data"] }
rpassword = "7.2"
sha2 = "0.10"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
base64 = "0.21"

[build-dependencies]
protobuf-codegen = "3.7"
